        - path: /etc/rancher/rancherd/config.yaml.d/10-harvester.yaml
          permissions: 384
          owner: 0
          group: 0
          content: |
            resources:
            # create the cattle-monitoring-system namespace and SA upfront, so that kubevirt monitoring-operator integration can find it
            - apiVersion: v1
              kind: Namespace
              metadata:
                name: cattle-monitoring-system
            - apiVersion: v1
              kind: Namespace
              metadata:
                name: cattle-logging-system
            - apiVersion: v1
              kind: ServiceAccount
              metadata:
                annotations:
                  meta.helm.sh/release-name: rancher-monitoring
                  meta.helm.sh/release-namespace: cattle-monitoring-system
                labels:
                  app: rancher-monitoring-operator
                  app.kubernetes.io/component: prometheus-operator
                  app.kubernetes.io/instance: rancher-monitoring
                  app.kubernetes.io/managed-by: Helm
                  app.kubernetes.io/name: rancher-monitoring-prometheus-operator
                  heritage: Helm
                  release: rancher-monitoring
                name: rancher-monitoring-operator
                namespace: cattle-monitoring-system
            - apiVersion: helm.cattle.io/v1
              kind: HelmChartConfig
              metadata:
                name: rke2-ingress-nginx
                namespace: kube-system
              spec:
                valuesContent: |-
                  controller:
                    config:
                      proxy-body-size: "0"
                      proxy-request-buffering: "off"
                    admissionWebhooks:
                      port: 8444
                    publishService:
                      pathOverride: kube-system/ingress-expose
                    extraArgs:
                      default-ssl-certificate: cattle-system/tls-rancher-internal
            - apiVersion: v1
              kind: Secret
              metadata:
                name: tls-ingress
                namespace: cattle-system
              type: Opaque
              data:
                tls.crt: Cg==
                tls.key: Cg==
            - apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: rancher-expose
                namespace: cattle-system
              spec:
                rules:
                - http:
                    paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: rancher
                          port:
                            number: 80
            - apiVersion: management.cattle.io/v3
              kind: ManagedChart
              metadata:
                name: harvester
                namespace: fleet-local
